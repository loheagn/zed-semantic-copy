[package]
name = "zed-semantic-copy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Semantic copy workflow for Zed"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.25.10"
tree-sitter-go = "0.25.0"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
